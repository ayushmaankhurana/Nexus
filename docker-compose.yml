version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: nexus-db
    restart: always
    environment:
      - POSTGRES_USER=nexus_admin
      - POSTGRES_PASSWORD=nexus_secure_password_2026
      - POSTGRES_DB=nexus_platform
    ports:
      - "5432:5432"
    volumes:
      - nexus_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus_admin -d nexus_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nexus_db_data: